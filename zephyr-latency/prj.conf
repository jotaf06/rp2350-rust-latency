# Common configuration. Profile and mode come from prof-*.conf / mode-*.conf.

# USB CDC ACM, brought up by the kernel at boot (no application code).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0xc0de
CONFIG_CDC_ACM_SERIAL_PID=0xcafe
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="STR-UFAL"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="zephyr-latency"
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Marker pins and LED through the GPIO driver (also pulls in pico-sdk's
# hardware_gpio, used to route GPIO0 to the PWM).
CONFIG_GPIO=y

# Nothing else talks during a batch: no console, no logging.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_ASSERT=n

# Batch loop / USB output runs in main; main() moves itself to the load's
# priority at start (see main.c).
CONFIG_MAIN_THREAD_PRIORITY=14
CONFIG_MAIN_STACK_SIZE=2048
